service: real-state-api

frameworkVersion: '3'

provider:
  name: aws
  runtime: python3.11
  region: 'us-east-2'
  stage: ${opt:stage, 'prod'}

  apiGateway:
    apiKeys:
      - real-state-api-key-${self:provider.stage}

  environment:
    stage: ${self:provider.stage}
    debug: false
    database_url: ${env:DATABASE_URL}
    # VPC environment variables removed (no longer needed for external DB)
    # vpc_security_group_id: ${env:VPC_SECURITY_GROUP_ID}
    # vpc_subnet_id_1: ${env:VPC_SUBNET_ID_1}
    # vpc_subnet_id_2: ${env:VPC_SUBNET_ID_2}

  iam:
    role:
      statements:
        # VPC-related permissions removed (no longer needed for external DB)
        # - Effect: Allow
        #   Action:
        #     - ec2:CreateNetworkInterface
        #     - ec2:DescribeNetworkInterfaces
        #     - ec2:DeleteNetworkInterface
        #   Resource: "*"
        - Effect: Allow
          Action:
            - logs:CreateLogGroup
            - logs:CreateLogStream
            - logs:PutLogEvents
          Resource: "*"

  memorySize: 1024
  timeout: 30
  logRetentionInDays: 14

functions:
  api:
    handler: app.main.handler
    # VPC configuration removed to allow internet access for external database
    # vpc:
    #   securityGroupIds:
    #     - ${env:VPC_SECURITY_GROUP_ID}
    #   subnetIds:
    #     - ${env:VPC_SUBNET_ID_1}
    #     - ${env:VPC_SUBNET_ID_2}
    events:
      - http:
          path: /api/v1/search/general
          method: POST
          cors: true
          private: true

plugins:
  - serverless-python-requirements

custom:
  pythonRequirements:
    dockerizePip: non-linux
    requirementsFile: requirements-prod.txt
    noDeploy:
      - black
      - isort
      - flake8
      - mypy
      - pre-commit
      - pytest
      - pytest-*
      - coverage
      - serverless-wsgi
    zip: false
    slim: false
    usePoetry: false
    useStaticCache: false
    useDownloadCache: false
